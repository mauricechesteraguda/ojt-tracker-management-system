# infra-10032026-Maurice
# Modification type: route through PHP-FPM as a non-root web process and retain a status-only health endpoint.
log_format structured escape=json '{"timestamp":"$time_iso8601","level":"info","event":"http_access","component":"nginx","operation":"request","status":"$status","method":"$request_method","path":"$uri","correlation_id":"$http_x_correlation_id"}';
error_log /dev/null error;
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;
    access_log /dev/stdout structured;
    error_log /dev/stderr error;

    location = /healthz {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # fix-10032026-Maurice: preserve bearer credentials across the Nginx/FPM boundary.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass php-fpm:9000;
    }
}
